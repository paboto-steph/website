<body class="landing">
<!-- The front door: only the PABOTO film. A click, a tap or Enter opens the work,
     and when the film has played once, the work opens by itself. -->
<h1 class="sr">PABOTO · Stephanie Pabotoy, creative consultant and photographer in Copenhagen</h1>
<a class="film-door" href="/work" aria-label="Enter PABOTO and see the work">
  <video id="film" autoplay muted playsinline preload="auto" poster="/video/paboto-intro-poster.jpg" aria-hidden="true">
    <source src="/video/paboto-intro-1080.mp4" type="video/mp4" media="(min-width: 1100px)">
    <source src="/video/paboto-intro-720.mp4" type="video/mp4">
  </video>
</a>
<script>
  var film = document.getElementById('film');
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { film.removeAttribute('autoplay'); film.pause(); }
  film.addEventListener('ended', function () { location.href = '/work'; });
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); location.href = '/work'; } });
</script>
</body>
